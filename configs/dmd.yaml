# Decoupled DMD, 4-step student. Full fine-tune: student, fake critic and frozen teacher are separate copies.
trainer: trainers.dmdr.DDMDRTrainer
pretrained_model_name_or_path: briaai/Fibo-2.0-dev
json_data_input_path: data_input.json
checkpoint_local_path: checkpoints/dmd
output_dir: output/dmd
wandb_project: dmd
wandb_name: dmd
seed: 42
mixed_precision: bf16
debug: 0
max_train_steps: 1000
gradient_accumulation_steps: 1
learning_rate: 0.00001
lr_scheduler: constant_with_warmup
lr_warmup_steps: 100
max_grad_norm: 1.0
regional_compile: 1
fsdp_sharding_strategy: hybrid
checkpointing_steps: 100
denoising_loss_scale: 0.0

dmd_num_inference_steps: "4"
dmd_real_guidance_scale: 4.0
dmd_real_guidance_min: 3.0  # teacher CFG drawn per record in [3, 5]
dmd_real_guidance_max: 5.0
dmd_pdmd: dm
dfake_gen_update_ratio: 5
teacher_force_prob: 0.0
t2i_teacher_path: path/to/second_teacher  # placeholder; used only with t2i_teacher_prob > 0
t2i_teacher_prob: 0.0  # off

dmdr_scale: 0.0  # DMDR off; > 0 adds the Qwen3-VL judge loss
dmdr_prob: 0.5
dmdr_min_segment: 2
dmdr_judge: Qwen/Qwen3-VL-8B-Instruct
