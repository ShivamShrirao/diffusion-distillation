# Decoupled DMD on edit and T2I data, 4-step student. Edit datasets carry "edit": true in the data JSON.
trainer: trainers.dmd_edit.DDMDREditTrainer
pretrained_model_name_or_path: briaai/Fibo-2.0-dev
json_data_input_path: data_input.json
checkpoint_local_path: checkpoints/dmd_edit
output_dir: output/dmd_edit
wandb_project: dmd_edit
wandb_name: dmd_edit
seed: 42
mixed_precision: bf16
debug: 0
max_train_steps: 400
gradient_accumulation_steps: 2
dmd_group_order: EDIT,T2I  # one edit, then one T2I micro-step per update
learning_rate: 0.000005  # student: cosine decay to 0 at max_train_steps
lr_scheduler: cosine
fake_lr: 0.00001  # fake: constant after warmup
fake_lr_scheduler: constant_with_warmup
lr_warmup_steps: 100
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-10
adam_weight_decay: 0.01
max_grad_norm: 4.0
regional_compile: 1
attn_backend: fa3
gradient_checkpointing: 1
gradient_checkpoint_first_n_blocks: 44
fsdp_sharding_strategy: hybrid
checkpointing_steps: 50
denoising_loss_scale: 0.0

dmd_num_inference_steps: "4"
tdm_segment_renoise: 1  # one random segment per record
dmd_real_guidance_scale: 4.0
dmd_real_guidance_min: 3.0  # teacher CFG drawn per record in [3, 5]
dmd_real_guidance_max: 5.0
dmd_pdmd: dm
dfake_gen_update_ratio: 3  # 3 fake updates per student update
ema_decay: 0.95  # power-EMA cap: ~ the last 20 student updates
ema_power_gamma: 0.75
ema_start_step: 100
teacher_force_prob: 0.5
t2i_teacher_path: path/to/second_teacher  # placeholder; used only when t2i_teacher is on
t2i_teacher_prob: 0.0  # T2I steps: 1.0 = always t2i_teacher (set t2i_teacher_path); edit steps keep the main teacher
t2i_teacher_segments: 0  # off; e.g. 1 = the noisiest segment's views take t2i_teacher
t2i_teacher_segment_frac: 1.0
t2i_teacher_below_sigma: 0.0  # off
t2i_teacher_below_sigma_prob: 1.0

dmdr_scale: 0.0  # DMDR off; > 0 adds the Qwen3-VL judge loss
dmdr_prob: 0.5
dmdr_min_segment: 2
dmdr_judge: Qwen/Qwen3-VL-8B-Instruct
dmdr_both_orders: 1  # the stock judge has a strong position bias
dmdr_groups: T2I,EDIT  # step kinds the judge scores
dmdr_edit_prompt: edit  # edit steps: the pairwise edit prompt with the record's images to edit
dmdr_text_scale: 0.0  # e.g. 0.02: exact-text check on records whose caption has text_render
dmdr_text_prob: 0.7
